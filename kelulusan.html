<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumuman Kelulusan</title>

<link rel="stylesheet" href="kelulusan.css">

<style>

/* BOX UTAMA */
.box-kelulusan{
max-width:650px;
margin:50px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

/* JUDUL */
.judul{
text-align:center;
margin-bottom:30px;
}

/* LOGO */
.logo-sekolah{
display:block;
margin:0 auto 15px;
filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3));
}

/* JUDUL */
.judul h1{
font-size:34px;
font-weight:bold;
color:#0a5c2f;
margin-bottom:10px;
}

.judul h2{
font-size:24px;
margin-bottom:10px;
color:#333;
}

.judul p{
font-size:16px;
line-height:28px;
color:#444;
}

/* FORM */
.form-group{
margin-bottom:20px;
}

.form-group label{
font-weight:bold;
margin-bottom:8px;
display:block;
}

.form-control{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

/* INFO FORMAT */
.info-format{
margin-top:8px;
font-size:13px;
color:#c0392b;
}

/* BUTTON */
.btn-primary{
width:100%;
background:#0a5c2f;
color:white;
border:none;
padding:14px;
font-size:18px;
font-weight:bold;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.btn-primary:hover{
background:#0d7a40;
}

/* HASIL */
.hasil{
margin-top:30px;
padding:25px;
border-radius:12px;
display:none;
line-height:30px;
}

/* LULUS */
.lulus{
background:#eafaf1;
border:2px solid #27ae60;
color:#145a32;
}

/* TIDAK LULUS */
.tidak-lulus{
background:#fdecea;
border:2px solid #e74c3c;
color:#922b21;
}

/* ERROR */
.error{
background:#fff8e1;
border:2px solid #f1c40f;
color:#7d6608;
}

/* JUDUL HASIL */
.hasil h3{
font-size:38px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

/* RESPONSIVE */
@media (max-width:768px){

.box-kelulusan{
margin:20px;
padding:25px;
}

.judul h1{
font-size:28px;
}

.hasil h3{
font-size:30px;
}

}

</style>

</head>

<body>

<div class="box-kelulusan">

<div class="judul">

<img src="logo.png"
class="logo-sekolah"
style="width:150px;height:auto;">

<h1>PENGUMUMAN KELULUSAN</h1>

<h2>MTs AR ROHMAN 1 BULU</h2>

<p>
Tahun Ajaran 2025/2026
</p>

</div>

<div class="form-group">

<label>Masukkan NISN</label>

<input
type="text"
id="nisn"
class="form-control"
placeholder="Masukkan NISN"
required>

</div>

<div class="form-group">

<label>Masukkan Tanggal Lahir</label>

<input
type="text"
id="tgl"
class="form-control"
placeholder="dd/mm/yyyy"
required>

<p class="info-format">
Format tanggal lahir: dd/mm/yyyy
</p>

</div>

<button
class="btn-primary"
onclick="validasiForm()">

CEK KELULUSAN

</button>

<div id="hasil" class="hasil"></div>

</div>

<script>

let dataSiswa = [];

/* BACA CSV */

fetch('data_kelulusan.csv')

.then(response => response.text())

.then(data => {

const rows = data.split('\n').slice(1);

dataSiswa = rows.map(row => {

const cols = row.split(';');

return {

nisn: cols[0]?.trim(),
tgl: cols[1]?.trim(),
nama: cols[2]?.trim(),
status: cols[3]?.trim()

};

});

});

/* VALIDASI FORM */

function validasiForm(){

let nisn =
document.getElementById("nisn");

let tgl =
document.getElementById("tgl");

let hasil =
document.getElementById("hasil");

/* reset hasil lama */
hasil.style.display="none";

if(!nisn.checkValidity()){

nisn.reportValidity();

return;

}

if(!tgl.checkValidity()){

tgl.reportValidity();

return;

}

cekKelulusan();

}
  
/* CEK KELULUSAN */

function cekKelulusan(){

let nisn = document.getElementById("nisn").value.trim();

let tgl = document.getElementById("tgl").value.trim();

let hasil = document.getElementById("hasil");

let ditemukan = dataSiswa.find(function(item){

return item.nisn === nisn &&
item.tgl === tgl;

});

if(ditemukan){

if(ditemukan.status === "LULUS"){

hasil.className = "hasil lulus";

}else{

hasil.className = "hasil tidak-lulus";

}

hasil.style.display = "block";

hasil.innerHTML = `

<div class="hasil-card">

<div class="header-lulus">

<img
src="logo.png"
class="logo-hasil">

<p class="tahun">
Tahun Pelajaran 2025/2026
</p>

<div class="status">

<div class="status-kecil">
DINYATAKAN
</div>

<div class="status-besar">
${ditemukan.status}
</div>

</div>

</div>


<div class="data-box">

<div class="judul-data">
DATA SISWA
</div>

<div class="data-item">

<label>Nama Lengkap</label>

<div class="isi">
${ditemukan.nama}
</div>

</div>

<div class="grid">

<div>

<label>NISN</label>

<div class="isi">
${ditemukan.nisn}
</div>

</div>

<div>

<label>Kelas</label>

<div class="isi">
IX
</div>

</div>

</div>

<div>

<label>Tanggal Lahir</label>

<div class="isi">
${ditemukan.tgl}
</div>

</div>

</div>


<div class="ucapan">

<b>Alhamdulillah.</b>

Selamat kamu telah dinyatakan
<b>LULUS</b>.

Segala lelah,
usaha,
dan doa yang kamu lakukan
akhirnya terbayar.

Teruslah melangkah,
raih cita-cita,
dan jadilah pribadi yang
bermanfaat.

</div>


<div class="verifikasi">

Dokumen digital terverifikasi

</div>


<button
class="cek-lagi"
onclick="location.reload()">

← Cek Siswa Lain

</button>

</div>

`;

}

}

</script>

</body>
</html>
