<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumuman Kelulusan</title>

<link rel="stylesheet" href="kelulusan.css">

</head>

<body>

<div class="container">

<div class="card-awal">

<img src="logo.png" class="logo">

<h1>PENGUMUMAN KELULUSAN</h1>

<h2>MTs AR ROHMAN 1 BULU</h2>

<p class="tahun">
Tahun Pelajaran 2025/2026
</p>

<div class="form-group">

<label>NISN</label>

<input
type="text"
id="nisn"
placeholder="Masukkan NISN"
inputmode="numeric"
maxlength="10"
oninput="this.value=this.value.replace(/[^0-9]/g,'')"
required>

</div>

<div class="form-group">

<label>Tanggal Lahir</label>

<input
type="text"
id="tgl"
placeholder="dd/mm/yyyy"
required>

<small>
Format: dd/mm/yyyy
</small>

</div>

<button
class="btn-cek"
onclick="validasiForm()">

CEK KELULUSAN

</button>

</div>

<div id="hasil"></div>

</div>

<script>

let dataSiswa=[];

fetch("data_kelulusan.csv")
.then(response=>response.text())
.then(data=>{

const rows=data.split("\n").slice(1);

dataSiswa=rows.map(row=>{

const cols=row.split(";");

return{

nisn:cols[0]?.trim(),
tgl:cols[1]?.trim(),
nama:cols[2]?.trim(),
status:cols[3]?.trim()

};

});

});

function validasiForm(){

let nisn=document.getElementById("nisn");
let tgl=document.getElementById("tgl");

if(!nisn.checkValidity()){

nisn.reportValidity();
return;

}

if(!tgl.checkValidity()){

tgl.reportValidity();
return;

}

cekKelulusan();

}
  
/* CEK KELULUSAN */

function cekKelulusan(){

let nisn = document.getElementById("nisn").value.trim();

let tgl = document.getElementById("tgl").value.trim();

let hasil = document.getElementById("hasil");

let ditemukan = dataSiswa.find(function(item){

return item.nisn === nisn &&
item.tgl === tgl;

});

if(ditemukan){

if(ditemukan.status === "LULUS"){

hasil.className = "hasil lulus";

}else{

hasil.className = "hasil tidak-lulus";

}

hasil.style.display = "block";

hasil.innerHTML=`

<div class="hasil-card">

<div class="header-lulus">

<img
src="logo.png"
class="logo-hasil">

<h2>
MTs AR ROHMAN 1 BULU
</h2>

<p class="tahun">
Tahun Pelajaran 2025/2026
</p>

<div class="status">

<div class="status-kecil">
DINYATAKAN
</div>

<div class="status-besar">

${ditemukan.status}

</div>

</div>

</div>


<div class="info-card">

<div class="card-title">
👤 DATA SISWA
</div>

<div class="info-item">
<span>Nama Lengkap</span>
<strong>${ditemukan.nama}</strong>
</div>

<div class="info-row">

<div class="info-item">
<span>NISN</span>
<strong>${ditemukan.nisn}</strong>
</div>

<div class="info-item">
<span>Kelas</span>
<strong>IX</strong>
</div>

</div>

<div class="info-item">
<span>Tanggal Lahir</span>
<strong>${ditemukan.tgl}</strong>
</div>

</div>


<div class="ucapan-card">

<div class="icon-lulus">
✅
</div>

<div>

<h3>Alhamdulillah, Selamat!</h3>

<p>

Kamu telah dinyatakan
<b>LULUS</b>
dari MTs AR ROHMAN 1 BULU
Tahun Pelajaran 2025/2026.

<br><br>

Teruslah belajar,
raih cita-cita,
dan jadilah pribadi yang
bermanfaat bagi agama,
bangsa, dan negara.

</p>

</div>

</div>

<div class="verifikasi">

Dokumen digital ini terverifikasi

<br>

${new Date().toLocaleDateString('id-ID')}

</div>


<button
class="cek-lagi"
onclick="location.reload()">

← Cek Siswa Lain

</button>


</div>

`;

}

}

</script>

</body>
</html>
