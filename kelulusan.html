<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumuman Kelulusan</title>

<link rel="stylesheet" href="kelulusan.css">

</head>

<body>

<div class="container">

<div class="card-awal">

<img src="logo.png" class="logo">

<h1>PENGUMUMAN KELULUSAN</h1>

<h2>MTs AR ROHMAN 1 BULU</h2>

<p class="tahun">
Tahun Pelajaran 2025/2026
</p>

<div class="form-group">

<label>NISN</label>

<input
type="text"
id="nisn"
placeholder="Masukkan NISN"
inputmode="numeric"
maxlength="10"
oninput="this.value=this.value.replace(/[^0-9]/g,'')"
required>

</div>

<div class="form-group">

<label>Tanggal Lahir</label>

<input
type="text"
id="tgl"
placeholder="dd/mm/yyyy"
inputmode="numeric"
maxlength="10"
oninput="formatTanggal(this)"
required>

<small>
Format: dd/mm/yyyy
</small>

</div>

<button
class="btn-cek"
onclick="validasiForm()">

CEK KELULUSAN

</button>

</div>

<div id="hasil"></div>

</div>

<script>

let dataSiswa=[];

/* WAKTU BUKA PENGUMUMAN */

const waktuBuka = new Date("2026-05-30T12:00:00");

if(new Date() < waktuBuka){

document.body.innerHTML = `

<div class="belum-buka">

<img src="logo.png" class="logo-lock">

<h1>Pengumuman Kelulusan</h1>

<h2>Belum Dapat Diakses</h2>

<p>

Akses akan dibuka pada:

<br><br>

<b>02 Juni 2026</b>

<br>

<b>17.00 WIB</b>

</p>

</div>

`;

throw new Error("Belum dibuka");

}

fetch("data_kelulusan.csv")
.then(response=>response.text())
.then(data=>{

const rows=data.split("\n").slice(1);

dataSiswa=rows.map(row=>{

const cols=row.split(";");

return{

nisn:cols[0]?.trim(),
tgl:cols[1]?.trim(),
nama:cols[2]?.trim(),
status:cols[3]?.trim()

};

});

});

function formatTanggal(input){

let angka = input.value.replace(/\D/g,'');

if(angka.length > 8){
angka = angka.substring(0,8);
}

if(angka.length > 4){

input.value =
angka.substring(0,2) + "/" +
angka.substring(2,4) + "/" +
angka.substring(4);

}
else if(angka.length > 2){

input.value =
angka.substring(0,2) + "/" +
angka.substring(2);

}
else{

input.value = angka;

}

}

function validasiForm(){

let nisn=document.getElementById("nisn");
let tgl=document.getElementById("tgl");

if(!nisn.checkValidity()){

nisn.reportValidity();
return;

}

if(!tgl.checkValidity()){

tgl.reportValidity();
return;

}

cekKelulusan();

}
  
function cekKelulusan(){

let nisn=document.getElementById("nisn").value.trim();
let tgl=document.getElementById("tgl").value.trim();

let siswa=dataSiswa.find(item=>

item.nisn===nisn &&
item.tgl===tgl

);

let hasil=document.getElementById("hasil");

if(!siswa){

hasil.innerHTML=`

<div class="hasil-error">

<h3>Data Tidak Ditemukan</h3>

<p>
Periksa kembali NISN dan tanggal lahir.
</p>

</div>

`;

return;

}

hasil.innerHTML=`

<div class="kartu-lulus">

<div class="header-lulus">

<img src="logo.png" class="logo-hasil">

<div class="nama-sekolah">

MTs AR ROHMAN 1 BULU

</div>

<div class="tahun-hasil">

Tahun Pelajaran 2025/2026

</div>

</div>


<div class="status-area">

<div class="status-kecil">

DINYATAKAN

</div>

<div class="status-besar">

${siswa.status}

</div>

<div class="status-besar
${siswa.status==='DITANGGUHKAN'
? 'status-ditangguhkan'
: ''}">

</div>

</div>


<div class="identitas">

<div class="row-data">

<span>Nama Lengkap</span>

<strong>

${siswa.nama}

</strong>

</div>

<div class="dua-kolom">

<div>

<span>NISN</span>

<strong>

${siswa.nisn}

</strong>

</div>

<div>

<span>Kelas</span>

<strong>

IX

</strong>

</div>

</div>

<div class="row-data">

<span>Tanggal Lahir</span>

<strong>

${siswa.tgl}

</strong>

</div>

</div>


let pesan = "";

if(siswa.status==="LULUS"){

pesan=`

<h3>🎓 Selamat!</h3>

<p>

Alhamdulillah, kamu telah dinyatakan
<b>LULUS</b> dari
MTs AR ROHMAN 1 BULU.

</p>

<br><br>

Semoga ilmu yang diperoleh
menjadi bekal untuk meraih cita-cita
dan menjadi pribadi yang
bermanfaat bagi agama,
bangsa dan negara.

</p>

`;

}

else if(siswa.status==="DITANGGUHKAN"){

pesan=`

<h3>📌 Kelulusan Ditangguhkan</h3>

<p>

Kelulusan Anda saat ini
<b>DITANGGUHKAN</b>.

Silakan segera menyelesaikan
tanggungan administrasi dan/atau
nilai praktik yang belum terpenuhi.

Untuk informasi lebih lanjut,
silakan menghubungi wali kelas
atau pihak madrasah.

</p>

`;

}

</div>


<div class="verifikasi">

Dokumen digital terverifikasi

<br><br>

Pengumuman ini sah dan diterbitkan oleh

<br>

<b>MTs AR ROHMAN 1 BULU</b>

<br><br>

</div>


<button
class="btn-kembali"
onclick="location.reload()">

← Cek Siswa Lain

</button>

</div>

`;

}

</script>

</body>
</html>
